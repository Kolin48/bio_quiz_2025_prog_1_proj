<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вопрос {{ question.number }} | Тест по биологии</title>
    <link rel="stylesheet" href="{% static 'bootstrap.min.css' %}">
</head>
<body>
    <div class="container mt-5">
        <div class="progress mb-4">
            <div class="progress-bar bg-success" role="progressbar" style="width: {{ question.progress }}%" aria-valuenow="{{ question.progress }}" aria-valuemin="0" aria-valuemax="100">
                {{ question.progress }}% пройдено
            </div>
        </div>
        
        <h3>Вопрос {{ question.number }} из 10</h3>
        <p class="lead">{{ question.text }}</p>
        
        <form method="POST" action="{% url 'submit_answer' %}">
            {% csrf_token %}
            <input type="hidden" name="question_id" value="{{ question.id }}">
            
            <div class="list-group mb-4">
                {% for variant in question.variants %}
                <label class="list-group-item">
                    <input class="form-check-input me-1" type="radio" name="answer" value="{{ variant.id }}" required>
                    {{ variant.text }}
                </label>
                {% endfor %}
            </div>
            
            <button type="submit" class="btn btn-primary">Ответить</button>
        </form>
        
        <div class="text-muted mt-3">Прогресс: {{ question.number }}/10</div>
    </div>
</body>
</html>
