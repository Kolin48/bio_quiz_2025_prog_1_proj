<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест по биологии</title>
    <link rel="stylesheet" href="{% static 'bootstrap.min.css' %}">
</head>
<body>
    <div class="container text-center mt-5">
        <h1 class="display-4 mb-4">Проверь свои знания биологии!</h1>
        <p class="lead">Пройди тест из 10 вопросов и узнай, насколько хорошо ты разбираешься в биологии.</p>
        
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <a href="{% url 'start_test' %}" class="btn btn-success btn-lg w-100">Начать тест</a>
            </div>
        </div>
        
        <div class="mt-5">
            <h3>О тесте:</h3>
            <ul class="list-unstyled">
                <li>Всего 10 вопросов</li>
                <li>Каждый вопрос — выбор одного правильного ответа</li>
                <li>По завершении увидишь свой результат</li>
                <li><a href="{% url 'theory' %}">Хочешь повторить теорию перед тестом?</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
