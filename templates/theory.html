{% extends 'base.html' %}

{% block content %}
  <h1>Теория по биологии</h1>
  <div class="theory-container">
    {% for page in theory_pages %}
      <section id="theory-{{ page.id }}">
        <h2>{{ page.title }}</h2>
        <p>{{ page.content|linebreaks }}</p>
      </section>
      <hr>
    {% empty %}
      <p>Теория пока не загружена.</p>
    {% endfor %}
  </div>
{% endblock %}
